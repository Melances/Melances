<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none" role="img" aria-label="Melances — Founder and CEO at Atherices Network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect width="1000" height="230" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="230" fill="url(#bg)"/>

    <!-- yumusak isik lekeleri -->
    <circle cx="150" cy="40" r="150" fill="#6d28d9" opacity="0.20">
      <animate attributeName="opacity" values="0.20;0.34;0.20" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="205" r="170" fill="#3b82f6" opacity="0.16">
      <animate attributeName="opacity" values="0.16;0.28;0.16" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- ince izgara -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 57.5H1000M0 115H1000M0 172.5H1000"/>
      <path d="M200 0V230M400 0V230M600 0V230M800 0V230"/>
    </g>

    <!-- alt dalga -->
    <path fill="#8b5cf6" fill-opacity="0.30"
      d="M0 186 Q 125 160 250 186 T 500 186 T 750 186 T 1000 186 V230 H0 Z">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="
          M0 186 Q 125 160 250 186 T 500 186 T 750 186 T 1000 186 V230 H0 Z;
          M0 186 Q 125 210 250 186 T 500 186 T 750 186 T 1000 186 V230 H0 Z;
          M0 186 Q 125 160 250 186 T 500 186 T 750 186 T 1000 186 V230 H0 Z"/>
    </path>
    <path fill="#a78bfa" fill-opacity="0.22"
      d="M0 200 Q 160 176 320 200 T 640 200 T 1000 200 V230 H0 Z">
      <animate attributeName="d" dur="11s" repeatCount="indefinite"
        values="
          M0 200 Q 160 176 320 200 T 640 200 T 1000 200 V230 H0 Z;
          M0 200 Q 160 222 320 200 T 640 200 T 1000 200 V230 H0 Z;
          M0 200 Q 160 176 320 200 T 640 200 T 1000 200 V230 H0 Z"/>
    </path>

    <!-- isim -->
    <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="500" y="98" font-size="66" font-weight="800" fill="url(#nameFill)" filter="url(#glow)"
            letter-spacing="2">
        Melances
        <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
      </text>

      <text x="500" y="135" font-size="17" font-weight="600" fill="#c4b5fd" letter-spacing="4.5">
        FOUNDER &amp; CEO
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.35s" fill="freeze"/>
      </text>

      <text x="500" y="162" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="1.2">
        Atherices Network
        <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.6s" fill="freeze"/>
      </text>
    </g>

    <!-- ust parlama cizgisi -->
    <rect x="0" y="0" width="1000" height="2.5" fill="url(#sheen)"/>
  </g>
</svg>
